[project]
name = "linto-stt"
version = "2.1.0"
description = "Automatic Speech Recognition API with support for multiple STT backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.2",
    "python-dotenv>=0.9.9",
    "fastapi>=0.121.0",
    "filelock>=3.12.0",
    "python-multipart>=0.0.20",
    "redis>=7.1.0",
    "regex>=2025.11.3",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[project.scripts]
linto-stt = "linto_stt:main"

[tool.setuptools.packages.find]
include = ["linto_stt*"]

[project.optional-dependencies]
nemo = [
    "auditok==0.3.0",
    "nemo-toolkit[asr]",
    "onnx==1.18",
    "torchaudio>=2.9.0",
    "torchcodec>=0.9.1",
    "wavio>=0.0.9",
    "hf_xet", # to speedup downloads from HuggingFace"
]
moshi = []

whisper = [
    "faster-whisper==1.2.1+linto",  # LinTO fork; source pinned in [tool.uv.sources]
    "wavio>=0.0.9",
    "auditok>=0.3.0",
]

whisper-torch = [
    "whisper-timestamped>=1.15.9",
    "torchaudio>=2.9.0",
    "torchcodec>=0.9.1",
    "wavio>=0.0.9",
    "auditok>=0.3.0",
]
kaldi = [
    "simple-websocket>=1.1.0",
    "vosk>=0.3.45",
    "wavio>=0.0.9",
]
recasepunc = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
kyutai = [
    "msgpack>=1.1.2",
]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "requests>=2.31",
]

# The engine extras are mutually exclusive (a deployment installs exactly one,
# e.g. `uv sync --extra whisper`). Declaring them as conflicting lets uv resolve
# each independently instead of demanding a single set that satisfies them all.
# This is required since the faster-whisper fork below pins tokenizers<0.21,
# which cannot co-resolve with nemo's transformers (tokenizers>=0.21).
[tool.uv]
conflicts = [
    [
        { extra = "nemo" },
        { extra = "whisper" },
        { extra = "whisper-torch" },
        { extra = "kaldi" },
        { extra = "kyutai" },
    ],
]

[[tool.uv.index]]
# NeMo's pyproject pins torch to this index for non-linux/non-darwin platforms.
# We mirror it (below) so our requirement set agrees with NeMo's; otherwise uv
# reports "conflicting indexes for package torch". `explicit = true` means the
# index is only used by sources that name it — it won't affect other packages.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# faster-whisper is LinTO's fork, tagged 1.2.1+linto (not on PyPI), so the
# `whisper` extra's "faster-whisper==1.2.1+linto" is resolved from git here.
# To bump: retag the fork and update both this tag and the version above.
faster-whisper = { git = "https://github.com/linto-ai/faster-whisper.git", tag = "1.2.1+linto" }
# NeMo pinned to a frozen main commit (snapshot of 2026-06-17). The released
# 2.7.x line lacks nemo.collections.asr.models.rnnt_bpe_models_prompt, required
# by newer prompt/streaming checkpoints such as
# nvidia/nemotron-3.5-asr-streaming-0.6b. Pinning to an explicit rev keeps the
# build reproducible; bump the rev deliberately to move forward.
nemo-toolkit = { git = "https://github.com/NVIDIA-NeMo/NeMo.git", rev = "0f378e9d8dd72630c911025b555f18658d44cc8f" }
# Match NeMo's torch index selection on the platforms where it diverges from
# PyPI, so the two requirement sets don't conflict during locking. linux/darwin
# keep PyPI's torch (uv's default), as before.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'darwin'" },
]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: Tests Docker (build + run container)",
    "uv: Tests via UV subprocess",
    "gpu: Requiert CUDA",
    "nemo: Backend NeMo",
    "whisper: Backend Whisper",
    "kaldi: Backend Kaldi",
    "slow: Tests > 2 minutes",
]
addopts = "-v --tb=short"
timeout = 900
# Stream log messages live so long waits (Docker build, model load, transcribe)
# show progress as they happen, instead of only on failure.
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(message)s"
log_cli_date_format = "%H:%M:%S"
